[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-mad"
version = "0.1.0"
description = "Auditable controlled multi-agent debate experiments with three- and five-round protocols"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cmad = "controlled_mad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
controlled_mad = ["resources/*.txt"]
